<div class="angular-app-container">
  <div class="angular-user-panel" *ngIf="userJson">
    <div class="angular-user-box">
      <div class="angular-user-icon">👤</div>
      <div class="angular-user-info">
        <div class="angular-user-name">{{ parsedUser?.name }}</div>
        <div class="angular-user-role">{{ parsedUser?.role }}</div>
      </div>
    </div>
  </div>
  <svg
    class="angular-logo"
    width="120"
    height="120"
    viewBox="0 0 250 250"
    xmlns="http://www.w3.org/2000/svg"
  >
    <path fill="#DD0031" d="M125 0L0 47l19 157 106 46 106-46 19-157z" />
    <path fill="#C3002F" d="M125 0v250l106-46 19-157z" />
    <path fill="#FFF" d="M125 30L57 190h28l12-31h55l12 31h28zm13 98h-26l13-34z" />
  </svg>
  <h2 class="angular-title">Angular App</h2>

  <button class="angular-button" (click)="updateUser()">
    Login from Angular
  </button>
</div>
